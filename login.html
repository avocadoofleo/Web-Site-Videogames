<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesi&oacute;n | PixelVault Gaming</title>
  <meta name="description" content="Inicia sesion en PixelVault Gaming.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <div id="siteHeader"></div>
  <main class="auth-page">
    <section class="auth-card">
      <p class="eyebrow">Cuenta PixelVault</p>
      <h1>Iniciar sesi&oacute;n</h1>
      <form id="loginForm" class="auth-form">
        <label>
          Correo
          <input name="email" type="email" placeholder="correo@ejemplo.com" required>
        </label>
        <label>
          Contrase&ntilde;a
          <input name="password" type="password" placeholder="Tu contrase&ntilde;a" required>
        </label>
        <button class="primary-button" type="submit">Iniciar sesi&oacute;n</button>
        <p class="form-status" id="loginStatus" role="status"></p>
      </form>
      <p class="auth-switch">&iquest;No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
    </section>
  </main>
  <div id="cartMount"></div>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
</body>
</html>
