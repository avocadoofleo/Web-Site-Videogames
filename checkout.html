<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | PixelVault Gaming</title>
  <meta name="description" content="Checkout profesional simulado de PixelVault Gaming.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <div id="siteHeader"></div>

  <main class="checkout-page">
    <nav class="breadcrumb" aria-label="Ruta de navegacion">
      <a href="index.html#catalogo">Tienda</a>
      <span>/</span>
      <span>Checkout</span>
    </nav>

    <section class="checkout-hero">
      <p class="eyebrow">Pago seguro simulado</p>
      <h1>Finaliza tu compra</h1>
      <p>Revisa tus productos, elige un m&eacute;todo de pago y recibe tus claves digitales.</p>
    </section>

    <section class="checkout-layout" aria-label="Resumen de compra">
      <div class="checkout-card">
        <div class="checkout-card-header">
          <div>
            <p class="eyebrow">Carrito</p>
            <h2>Productos comprados</h2>
          </div>
          <a class="ghost-button small-button" href="index.html#catalogo">Seguir comprando</a>
        </div>
        <div class="checkout-items" id="checkoutItems"></div>
      </div>

      <aside class="checkout-card summary-card">
        <p class="eyebrow">Resumen</p>
        <h2>Datos del pedido</h2>
        <form id="checkoutForm" class="checkout-form">
          <label>
            Nombre
            <input name="customerName" type="text" placeholder="Tu nombre" required>
          </label>
          <label>
            Correo
            <input name="customerEmail" type="email" placeholder="correo@ejemplo.com" required>
          </label>
          <label>
            Pa&iacute;s
            <select name="country" required>
              <option value="">Seleccionar pa&iacute;s</option>
              <option value="Mexico">M&eacute;xico</option>
              <option value="Colombia">Colombia</option>
              <option value="Argentina">Argentina</option>
              <option value="Chile">Chile</option>
              <option value="Peru">Per&uacute;</option>
            </select>
          </label>
          <label>
            M&eacute;todo de pago
            <select name="paymentMethod" required>
              <option value="Tarjeta">💳 Tarjeta</option>
              <option value="Transferencia">🏦 Transferencia</option>
              <option value="Vault Wallet">🎮 Vault Wallet</option>
              <option value="PayPal simulado">🟣 PayPal simulado</option>
            </select>
          </label>

          <div class="checkout-total">
            <div>
              <span>Subtotal</span>
              <strong id="checkoutSubtotal">$0.00</strong>
            </div>
            <div>
              <span>IVA simulado</span>
              <strong id="checkoutTax">$0.00</strong>
            </div>
            <div class="summary-total">
              <span>Total</span>
              <strong id="checkoutTotal">$0.00</strong>
            </div>
          </div>

          <button class="primary-button checkout-confirm" type="submit" data-confirm-order>Confirmar compra</button>
          <p class="form-status" id="checkoutStatus" role="status"></p>
        </form>
      </aside>
    </section>
  </main>

  <div id="cartMount"></div>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
</body>
</html>
