<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | PixelVault Gaming</title>
  <meta name="description" content="Contacto y soporte de PixelVault Gaming.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="siteHeader"></div>
  <main class="contact-page">
    <section class="section-band">
      <div class="section-heading">
        <p class="eyebrow">Soporte</p>
        <h1>Contacto PixelVault</h1>
        <p>Atenci&oacute;n simulada para pedidos, claves digitales y soporte de cuenta.</p>
      </div>
      <div class="contact-layout">
        <aside class="contact-info">
          <article>
            <span>📩</span>
            <strong>Correo</strong>
            <a href="mailto:soporte@pixelvaultgaming.com">soporte@pixelvaultgaming.com</a>
          </article>
          <article>
            <span>☎️</span>
            <strong>Tel&eacute;fono</strong>
            <a href="tel:+525555123456">+52 55 5512 3456</a>
          </article>
          <article>
            <span>📍</span>
            <strong>Direcci&oacute;n</strong>
            <p>Av. Digital 404, Ciudad Gamer, M&eacute;xico</p>
          </article>
          <div class="social-row">
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
            <a href="#">Discord</a>
          </div>
        </aside>
        <form class="contact-form" id="contactForm">
          <label>
            Nombre
            <input type="text" name="name" placeholder="Tu nombre" required>
          </label>
          <label>
            Correo
            <input type="email" name="email" placeholder="tu@email.com" required>
          </label>
          <label>
            Mensaje
            <textarea name="message" rows="6" placeholder="Escribe tu mensaje" required></textarea>
          </label>
          <button class="primary-button" type="submit">Enviar mensaje</button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="cartMount"></div>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
</body>
</html>
