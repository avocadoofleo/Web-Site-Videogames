<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | PixelVault Gaming</title>
  <meta name="description" content="Crea una cuenta en PixelVault Gaming.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <div id="siteHeader"></div>
  <main class="auth-page">
    <section class="auth-card">
      <p class="eyebrow">Nueva cuenta</p>
      <h1>Crear cuenta</h1>
      <form id="registerForm" class="auth-form">
        <label>
          Nombre
          <input name="name" type="text" placeholder="Tu nombre" required>
        </label>
        <label>
          Correo
          <input name="email" type="email" placeholder="correo@ejemplo.com" required>
        </label>
        <label>
          Contrase&ntilde;a
          <input name="password" type="password" placeholder="Minimo 6 caracteres" required>
        </label>
        <label>
          Confirmar contrase&ntilde;a
          <input name="confirmPassword" type="password" placeholder="Repite tu contrase&ntilde;a" required>
        </label>
        <button class="primary-button" type="submit">Crear cuenta</button>
        <p class="form-status" id="registerStatus" role="status"></p>
      </form>
      <p class="auth-switch">&iquest;Ya tienes cuenta? <a href="login.html">Iniciar sesi&oacute;n</a></p>
    </section>
  </main>
  <div id="cartMount"></div>
  <div id="siteFooter"></div>
  <script src="js/app.js"></script>
</body>
</html>
